name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    # 必须限定分支：tag 推送时 paths 过滤不生效，会导致打 tag 时误触发本 workflow
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
          run-install: true
      - name: Verify Vite+
        run: vp --version
